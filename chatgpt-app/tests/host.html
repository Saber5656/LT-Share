<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LT Share bridge test</title><style>body{margin:0;background:#f1f2f4;font-family:system-ui}p{font-size:12px;margin:12px;color:#626974}iframe{display:block;width:min(100%,620px);height:1400px;border:1px solid #e9ebee;border-radius:12px;background:white;margin:auto}</style><p>ローカル接続テスト用。要約結果はテストデータです。実際のChatGPT推論は実行しません。</p><iframe id="widget" title="LT Share" src="/widget" allow="clipboard-write"></iframe><script>
const frame=document.querySelector('iframe');window.messages=[];window.deny=false;window.pendingPrompt=null;
function pushResult(data){frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{structuredContent:data}},'*');}
window.pushResult=pushResult;
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.jsonrpc!=='2.0')return;const m=e.data;messages.push(m);if(m.method==='ui/notifications/size-changed')frame.style.height=m.params.height+'px';if(m.id){if(m.method==='ui/message'){pendingPrompt=m.params.content[0].text;if(window.deny==='result'){e.source.postMessage({jsonrpc:'2.0',id:m.id,result:{isError:true}},'*');return;}if(window.deny){e.source.postMessage({jsonrpc:'2.0',id:m.id,error:{code:-32000,message:'denied'}},'*');return;}}e.source.postMessage({jsonrpc:'2.0',id:m.id,result:m.method==='ui/initialize'?{protocolVersion:'2026-01-26',hostContext:{theme:'light'},hostCapabilities:{message:{},openLinks:{},updateModelContext:{}}}:{}},'*');}if(m.method==='ui/notifications/initialized')pushResult({draftId:'fixture-draft',body:'',tags:[],requestId:null,includeDeveloper:false});});
</script></html>
